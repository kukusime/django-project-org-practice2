{% extends 'base.html' %}
{% block content %}
<h1>Сотрудники</h1>
<a href="{% url 'employee_create' %}">+ Добавить</a>
<ul>
{% for employee in employees %}
    <li>
        <a href="{% url 'employee_detail' employee.pk %}">{{ employee }}</a>
        | <a href="{% url 'employee_update' employee.pk %}">Редактировать</a>
        | <a href="{% url 'employee_delete' employee.pk %}">Удалить</a>
    </li>
{% empty %}
    <li>Нет данных.</li>
{% endfor %}
</ul>
<a href="{% url 'home' %}">На главную</a>
{% endblock %}
