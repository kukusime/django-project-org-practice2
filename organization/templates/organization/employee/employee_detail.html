{% extends 'base.html' %}
{% block content %}
<h1>Детали: Сотрудники</h1>
<p><b>ID:</b> {{ employee.pk }}</p>
{% for field in employee.fields_list %}
    <!-- Поля выводятся автоматически в виде списка, но для красоты пропишем основные -->
{% endfor %}
<p><b>Название:</b> {{ employee }}</p>
{% if employee.photo %}
    <img src="{{ employee.photo.url }}" alt="employee" width="300">
{% endif %}
<br><br>
<a href="{% url 'employee_list' %}">Назад к списку</a>
{% endblock %}
