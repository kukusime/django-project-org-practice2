{% extends 'base.html' %}
{% block content %}
<h1>Отзывы</h1>
<a href="{% url 'review_create' %}">+ Добавить</a>
<ul>
{% for review in reviews %}
    <li>
        <a href="{% url 'review_detail' review.pk %}">{{ review }}</a>
        | <a href="{% url 'review_update' review.pk %}">Редактировать</a>
        | <a href="{% url 'review_delete' review.pk %}">Удалить</a>
    </li>
{% empty %}
    <li>Нет данных.</li>
{% endfor %}
</ul>
<a href="{% url 'home' %}">На главную</a>
{% endblock %}
